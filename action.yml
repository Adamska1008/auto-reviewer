name: "Auto Code Reviewer"
description: "Automatically review code changes using LLM and post comments to commits"

inputs:
  api_key:
    description: "Your LLM API Key"
    required: true
  base_url:
    description: "LLM API base URL (e.g., https://api.openai.com/v1)"
    required: true
  model:
    description: "LLM model to use"
    required: false
    default: "gpt-4.1"
  file_patterns:
    description: "File patterns to review (comma-separated, e.g., *.py,*.js)"
    required: false
    default: "*.py"
  github_token:
    description: "GitHub token for posting comments (default: GITHUB_TOKEN)"
    required: false
    default: ${{ github.token }}

outputs:
  review_result:
    description: "The review result from LLM"

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    AUTO_REVIEWER_API_KEY: ${{ inputs.api_key }}
    AUTO_REVIEWER_BASE_URL: ${{ inputs.base_url }}
    AUTO_REVIEWER_MODEL: ${{ inputs.model }}
    AUTO_REVIEWER_FILE_PATTERNS: ${{ inputs.file_patterns }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
