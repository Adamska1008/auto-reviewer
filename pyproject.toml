[project]
name = "auto-reviewer"
version = "0.1.0"
description = "Automatically review code changes using LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "openai>=2.17.0",
    "httpx>=0.28.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "unidiff>=0.7.5",
]

[project.scripts]
auto-reviewer = "auto_reviewer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "main.py",
    "prompts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
