[project]
name = "auto-reviewer"
version = "0.1.0"
description = "Automatically review code changes using LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "openai>=2.17.0",
    "httpx>=0.28.0",
]

[project.scripts]
auto-reviewer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "main.py",
    "prompts/*",
]
